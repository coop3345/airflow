# docker-compose.yaml - Airflow 3.3 with LocalExecutor
# Configured for:
# - LocalExecutor (no redis/worker needed)
# - DockerOperator support for GoLang app containers
# - MSSQL access to host machine via host.docker.internal
# - Pre-configured connections and variables baked in

x-airflow-common:
  &airflow-common
  image: custom-airflow:3.3.0
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret_change_me}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__SDK__COORDINATORS: '{"go": {"classpath": "airflow.sdk.coordinators.executable.ExecutableCoordinator", "kwargs": {"executables_root": ["/opt/airflow/executable-bundles"]}}}'
    AIRFLOW__SDK__QUEUE_TO_COORDINATOR: '{"golang": "go"}'
    AIRFLOW_CONN_MSSQL_DEFAULT: ${AIRFLOW_CONN_MSSQL_DEFAULT}
    AIRFLOW_CONN_CFB_SQLSERVER_CONN: ${AIRFLOW_CONN_CFB_SQLSERVER_CONN:-${AIRFLOW_CONN_DSN_SSMS}}
    AIRFLOW_VAR_CFB_API_TOKEN: ${AIRFLOW_VAR_CFB_API_TOKEN:-${AIRFLOW_VAR_API_TOKEN}}
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./deps:/opt/airflow/deps
    - ./util:/opt/airflow/util
    - ./executable-bundles:/opt/airflow/executable-bundles
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - airflow-network
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    env_file:
      - .env
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - airflow-network

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config
      - ./deps:/opt/airflow/deps
      - ./util:/opt/airflow/util
      - ./executable-bundles:/opt/airflow/executable-bundles
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/{logs,dags,plugins,config,executable-bundles}
        chown -R "$${AIRFLOW_UID:-50000}:0" /opt/airflow/
        echo "Running database migration and creating admin user..."
        /entrypoint airflow version
        echo "Creating custom connections..."
        if [ -n "$${AIRFLOW_CONN_MSSQL_DEFAULT}" ]; then
          /entrypoint airflow connections delete mssql_default || true
          /entrypoint airflow connections add mssql_default --conn-uri "$${AIRFLOW_CONN_MSSQL_DEFAULT}"
          echo "MSSQL connection created"
        else
          echo "AIRFLOW_CONN_MSSQL_DEFAULT not set - skipping"
        fi
        if [ -n "$${AIRFLOW_CONN_CFB_SQLSERVER_CONN}" ]; then
          /entrypoint airflow connections delete cfb_sqlserver_conn || true
          /entrypoint airflow connections add cfb_sqlserver_conn --conn-uri "$${AIRFLOW_CONN_CFB_SQLSERVER_CONN}"
          echo "CFB SQL Server connection created"
        fi
        echo "Setting Airflow variables..."
        [ -n "$${AIRFLOW_VAR_CFB_API_TOKEN}" ] && /entrypoint airflow variables set CFB_API_TOKEN "$${AIRFLOW_VAR_CFB_API_TOKEN}" || true
        [ -n "$${AIRFLOW_VAR_DSN_STRING}" ] && /entrypoint airflow variables set DSN_STRING "$${AIRFLOW_VAR_DSN_STRING}" || true
        /entrypoint airflow pools set motherduck_writer 1 "serialize DuckDB/MotherDuck writes" || true
        echo "Airflow initialization complete"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  postgres-db-volume:

networks:
  airflow-network:
    driver: bridge
